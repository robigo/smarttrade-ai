<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartTrade AI | מסחר מדומה</title><style>body{font:16px Arial;background:#0b1522;color:#e9f2f5;margin:0}header,main{max-width:850px;margin:auto;padding:20px}section{background:#17283a;padding:18px;border-radius:14px;margin:15px 0}button,select,input{padding:11px;margin:5px;border-radius:8px;border:0}button{cursor:pointer;background:#35bca1;color:#071c20}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #3b4e5d;text-align:right}.muted{color:#b3c5d1}</style><header><h1>SmartTrade AI · v0.2</h1><p class="muted">סביבת לימוד בלבד · נתוני מחירים פיקטיביים וקבועים · ללא מסחר אמיתי</p></header><main><section><h2>התיק הווירטואלי</h2><h1 id="total"></h1><p id="cash"></p><p id="exposure"></p></section><section><h2>עסקה מדומה</h2><select id="asset"></select><select id="side"><option value="buy">קנייה</option><option value="sell">מכירה</option></select><input id="qty" type="number" min="0.001" step="0.001" value="1"><label>תקרת חשיפה מנייתית <select id="limit"><option>25</option><option selected>45</option><option>60</option><option>100</option></select>%</label><button id="trade">בצע עסקה מדומה</button><p id="msg"></p></section><section><h2>בדיקת ירידות</h2><label>ירידת מניות <select id="shock"><option value="10">10%</option><option value="20">20%</option><option value="30" selected>30%</option><option value="50">50%</option></select></label><p id="stress"></p><p class="muted">המחשה בלבד: נכסים אחרים ללא שינוי. אין כאן תחזית או הגנה מהפסדים.</p></section><section><h2>החזקות</h2><table><thead><tr><th>נייר</th><th>יחידות</th><th>שווי</th></tr></thead><tbody id="holdings"></tbody></table></section><section><h2>עסקאות</h2><table><thead><tr><th>תאריך</th><th>פעולה</th><th>נייר</th><th>כמות</th><th>סכום</th></tr></thead><tbody id="history"></tbody></table><button id="json">ייצוא JSON</button><button id="csv">ייצוא CSV</button><button id="reset">איפוס תיק מדומה</button></section></main><script>
const A=[{id:'WORLD',name:'מדד מניות עולמי (הדגמה)',price:100,kind:'stock'},{id:'SP500',name:'S&P 500 (הדגמה)',price:250,kind:'stock'},{id:'TA125',name:'תל אביב 125 (הדגמה)',price:125,kind:'stock'},{id:'GOV',name:'אג"ח ממשלתי (הדגמה)',price:100,kind:'bond'},{id:'CASH',name:'קרן כספית (הדגמה)',price:10,kind:'cash'}];const KEY='smarttrade-v02',LKEY='smarttrade-limit';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||typeof state.cash!=='number'||!state.units||!Array.isArray(state.trades))state={cash:15000,units:{},trades:[]};const el=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS'}).format(n),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),portfolio=()=>state.cash+A.reduce((s,a)=>s+(state.units[a.id]||0)*a.price,0),stocks=()=>A.filter(a=>a.kind==='stock').reduce((s,a)=>s+(state.units[a.id]||0)*a.price,0);
A.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=a.name+' · '+money(a.price);el('asset').append(o)});el('limit').value=localStorage.getItem(LKEY)||'45';el('limit').onchange=()=>{localStorage.setItem(LKEY,el('limit').value);render()};el('shock').onchange=render;
function render(){el('total').textContent=money(portfolio());el('cash').textContent='מזומן: '+money(state.cash);el('exposure').textContent='חשיפה מנייתית: '+(100*stocks()/portfolio()).toFixed(1)+'%';el('stress').textContent='שווי בתרחיש: '+money(portfolio()-stocks()*Number(el('shock').value)/100);el('holdings').replaceChildren();A.filter(a=>(state.units[a.id]||0)>0).forEach(a=>{const tr=document.createElement('tr');[a.name,state.units[a.id],money(state.units[a.id]*a.price)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});el('holdings').append(tr)});el('history').replaceChildren();state.trades.slice().reverse().forEach(t=>{const tr=document.createElement('tr');[t.date,t.side==='buy'?'קנייה':'מכירה',t.id,t.qty,money(t.sum)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});el('history').append(tr)})}
el('trade').onclick=()=>{const a=A.find(a=>a.id===el('asset').value),q=Number(el('qty').value),side=el('side').value,sum=q*a.price;let error='';if(!Number.isFinite(q)||q<=0||Math.round(q*1000)!==q*1000)error='כמות לא תקינה';else if(side==='buy'&&sum>state.cash+1e-8)error='אין מספיק מזומן';else if(side==='sell'&&q>(state.units[a.id]||0)+1e-8)error='אין מספיק יחידות';else if(side==='buy'&&a.kind==='stock'&&(stocks()+sum)/portfolio()*100>Number(el('limit').value)+1e-8)error='חריגה מתקרת המניות';if(error){el('msg').textContent=error;return}state.cash=Number((state.cash+(side==='buy'?-sum:sum)).toFixed(6));state.units[a.id]=Number(((state.units[a.id]||0)+(side==='buy'?q:-q)).toFixed(6));state.trades.push({date:new Date().toLocaleString('he-IL'),side,id:a.id,qty:q,sum});save();el('msg').textContent='העסקה המדומה נרשמה';render()};
function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}el('json').onclick=()=>download('portfolio.json',JSON.stringify({version:'0.2',state,limit:el('limit').value},null,2),'application/json');el('csv').onclick=()=>{const rows=[['date','side','symbol','quantity','amount_ils'],...state.trades.map(t=>[t.date,t.side,t.id,t.qty,t.sum])];download('trades.csv','\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv')};el('reset').onclick=()=>{if(confirm('לאפס את התיק המדומה?')){state={cash:15000,units:{},trades:[]};save();render()}};render();
</script></html>
