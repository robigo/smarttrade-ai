name: SmartTrade Preview UI Smoke Tests
on:
  push:
    branches:
      - test/preview-ui-smoke-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local-only preview asset server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory preview-public > /tmp/smarttrade-ui-server.log 2>&1 &
          echo $! > /tmp/smarttrade-ui-server.pid
      - name: Run paper-trading browser smoke tests
        run: node test/preview-ui-smoke.mjs
