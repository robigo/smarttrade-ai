name: Check Twelve Data connection

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check quote availability without publishing prices
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          key = os.getenv("TWELVE_DATA_API_KEY", "")
          if not key:
              print("FAIL: TWELVE_DATA_API_KEY secret is missing")
              sys.exit(1)
          url = "https://api.twelvedata.com/quote?" + urllib.parse.urlencode({"symbol":"AAPL","apikey":key})
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"SmartTrade-connection-check/1.0"}), timeout=15) as response:
                  data = json.load(response)
              if data.get("status") == "error" or "close" not in data:
                  print("FAIL: API returned no usable quote (check key, plan or quota)")
                  sys.exit(1)
              print("PASS: API key accepted and AAPL quote fields received")
          except Exception:
              print("FAIL: request failed (network, key, quota, or API response)")
              sys.exit(1)
          PY
