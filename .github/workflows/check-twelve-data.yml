name: SmartTrade Market Access Guard (no provider calls)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify anonymous Preview requests stay blocked
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://smarttrade-ai-preview.goshen-r.workers.dev';
          for(const path of ['/api/market/status','/api/market/quote?symbol=AAPL']){
            const response=await fetch(base+path,{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(8000)});
            assert.equal(response.status,401);
            assert.equal(response.headers.get('cache-control'),'no-store');
            assert.equal((await response.json()).error,'unauthorized');
          }
          console.log('PASS: anonymous access blocked. No provider key or direct provider request.');
          JS
