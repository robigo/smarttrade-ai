name: SmartTrade Preview Deploy
on:
  push:
    branches:
      - preview/cloudflare-unified-v09
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smarttrade-preview-deploy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preview code and target
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/auth.js
          node --check cloudflare/src/preview.js
          node --test test/*.test.mjs
          node --check cloudflare/src/market-quota-do.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const cfg=JSON.parse(fs.readFileSync('wrangler.preview.json','utf8'));
          assert.equal(cfg.name,'smarttrade-ai-preview');
          assert.equal(cfg.main,'cloudflare/src/preview.js');
          assert.equal(cfg.workers_dev,true);
          assert.equal(cfg.assets.directory,'./preview-public');
          assert.equal(cfg.durable_objects.bindings[0].name,'MARKET_QUOTA');
          assert.equal(cfg.migrations[0].new_sqlite_classes[0],'MarketQuota');
          assert.equal(cfg.assets.binding,'ASSETS');
          assert.equal(cfg.assets.run_worker_first,true);
          assert.match(fs.readFileSync('preview-public/index.html','utf8'),/SmartTrade AI/);
          JS
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/preview/cloudflare-unified-v09' && github.repository == 'robigo/smarttrade-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy isolated Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          # Normalize copy/paste artifacts without logging the account identifier.
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\\r\\n\\t ' | tr -d '"')"
          export CLOUDFLARE_ACCOUNT_ID
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::Cloudflare Account ID must be exactly 32 hexadecimal characters (after normalization)."
            exit 1
          fi
          npx --yes wrangler@4.151.2 deploy --config wrangler.preview.json
      - name: Check preview health
        run: |
          node --input-type=module <<'JS'
          const url='https://smarttrade-ai-preview.goshen-r.workers.dev/health';
          let ok=false;
          for(let attempt=0;attempt<5;attempt++){
            try {
              const r=await fetch(url,{signal:AbortSignal.timeout(8000),cache:'no-store'});
              const d=await r.json();
              if(r.ok&&d.status==='ok'&&d.service==='smarttrade-ai-preview'){ok=true;break}
            } catch {}
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          if(!ok)throw Error('Preview health check failed');
          console.log('Preview health check passed');
          JS
  post_deploy_auth_guard:
    needs: deploy
    if: github.ref == 'refs/heads/preview/cloudflare-unified-v09' && github.repository == 'robigo/smarttrade-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed Preview rejects anonymous market requests
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://smarttrade-ai-preview.goshen-r.workers.dev';
          for (const path of ['/api/market/status','/api/market/quote?symbol=AAPL']) {
            const response=await fetch(base+path,{
              headers:{accept:'application/json'},
              redirect:'manual',
              cache:'no-store',
              signal:AbortSignal.timeout(8000)
            });
            assert.equal(response.status,401,`Expected 401 for ${path}, got ${response.status}`);
            assert.equal(response.headers.get('cache-control'),'no-store');
            const body=await response.json();
            assert.equal(body.error,'unauthorized');
          }
          console.log('Post-deploy anonymous-access checks passed; no quotes requested from provider.');
          JS
  next_task_gate:
    needs: [verify, deploy, post_deploy_auth_guard]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/preview/cloudflare-unified-v09' && github.repository == 'robigo/smarttrade-ai' && needs.verify.result == 'success' && needs.deploy.result == 'success' && needs.post_deploy_auth_guard.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Publish safe next development gate
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Preview checks passed — next development gate'
            echo ''
            echo "Verified commit: \`$COMMIT_SHA\`"
            echo ''
            echo 'Next candidate: add isolated regression tests for cache misses, invalid symbols and quota-denied responses.'
            echo ''
            echo 'Status: READY FOR AGENT PICKUP, NOT EXECUTED.'
            echo 'This job has read-only permissions. It does not run an AI agent, create commits, enable quotes, or promote to staging/production.'
            echo 'Agent execution requires a separately reviewed, least-privilege runner and explicit environment promotion gates.'
          } >> "$GITHUB_STEP_SUMMARY"
