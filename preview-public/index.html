<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartTrade AI | TOP 20</title><style>body{background:#0b1522;color:#e9f2f5;font:16px Arial;margin:auto;max-width:900px;padding:16px}section{background:#17283a;border-radius:14px;padding:16px;margin:12px 0}button,select,textarea{font:inherit;padding:10px;border-radius:8px;max-width:100%;box-sizing:border-box}button{background:#35bca1;border:0;cursor:pointer;margin:4px}textarea{width:100%;min-height:100px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #40546a;text-align:right;overflow-wrap:anywhere}a{color:#8bd9ff}svg{width:100%;height:auto}small{color:#b3c5d1}meter{width:100%;height:32px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><a href="/portfolio-legacy.html">תיק מדומה — גרסה קודמת</a><h1>ניתוח טכני | TOP 20</h1><section><p>נתונים ציבוריים בלבד. ייבוא ידני מ־ChatGPT, ללא API וללא מסחר. נתונים מיובאים אינם מאומתים עצמאית.</p><button id="rank">העתק פרומפט דירוג</button><textarea id="ranking" placeholder="הדבק JSON של דירוג 20 חברות"></textarea><button id="loadRank">ייבוא דירוג</button><p id="rankDate"></p><select id="symbol" aria-label="בחירת חברה"><option value="">טרם יובא דירוג</option></select><button id="prompt">העתק פרומפט ניתוח</button><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">פתח ChatGPT</a><textarea id="analysis" placeholder="הדבק JSON של הניתוח"></textarea><button id="load">ייבוא ניתוח</button><p id="status" role="status"></p></section><section id="result" hidden><h2 id="name"></h2><h2 id="price"></h2><p id="date"></p><svg id="chart" viewBox="0 0 600 200" role="img" aria-label="גרף מחירי סגירה"></svg><h3>ציון טכני</h3><meter id="score" min="0" max="100"></meter><p id="scoreText"></p><h3>אינדיקטורים</h3><table id="ind"></table><h3>תמיכות והתנגדויות</h3><p id="levels"></p><h3>תרחישים</h3><table id="scenarios"></table><h3>נתונים עסקיים</h3><p id="business"></p><h3>מסקנה וסיכון</h3><p id="summary"></p><h3>מקורות</h3><div id="sources"></div></section><section><h2>השוואת חברות שנבדקו</h2><table id="compare"></table></section><script>
'use strict';
const e=id=>document.getElementById(id), validSymbol=s=>typeof s==='string'&&/^[A-Z][A-Z0-9.-]{0,9}$/.test(s), finite=n=>typeof n==='number'&&Number.isFinite(n), date=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}T/.test(s)&&Number.isFinite(Date.parse(s))&&Date.parse(s)<=Date.now()+300000, str=s=>typeof s==='string'&&s.length<=3000, source=s=>{try{return typeof s==='string'&&new URL(s).protocol==='https:'}catch{return false}}, msg=s=>e('status').textContent=s;
let ranking=[], analyses=new Map();
function table(id,rows){const t=e(id);t.replaceChildren();for(const row of rows){const tr=t.insertRow();for(const v of row){const td=tr.insertCell();td.textContent=String(v??'לא זמין')}}}
async function copy(s){try{await navigator.clipboard.writeText(s);msg('הפרומפט הועתק')}catch{e('analysis').value=s;msg('הפרומפט מוצג להעתקה ידנית')}}
e('rank').onclick=()=>copy('Research the current 20 largest US-listed US companies by market cap, one share class per company. Return JSON only: {"asOf":"ISO timestamp","source":"https://...","companies":[{"symbol":"...","name":"...","marketCap":123}]}. Use current public sources; do not invent. Exactly 20, descending USD market cap.');
e('loadRank').onclick=()=>{try{const x=JSON.parse(e('ranking').value);if(!date(x.asOf)||!source(x.source)||!Array.isArray(x.companies)||x.companies.length!==20||new Set(x.companies.map(v=>v.symbol)).size!==20||!x.companies.every((v,i)=>validSymbol(v.symbol)&&str(v.name)&&finite(v.marketCap)&&v.marketCap>0&&(!i||v.marketCap<=x.companies[i-1].marketCap)))throw Error();ranking=x.companies;analyses.clear();e('result').hidden=true;e('symbol').replaceChildren();ranking.forEach((v,i)=>{const o=document.createElement('option');o.value=v.symbol;o.textContent=(i+1)+'. '+v.name+' ('+v.symbol+')';e('symbol').append(o)});e('rankDate').textContent='דירוג מיובא: '+x.asOf+' | '+x.source;compare();msg('הדירוג נטען')}catch{msg('דירוג לא תקין')}}; 
e('prompt').onclick=()=>{const s=e('symbol').value;if(!validSymbol(s))return msg('ייבא דירוג תחילה');copy('Analyze '+s+' using current public sources only. Return JSON only with symbol, asOf (ISO timestamp), price (USD or null), changePct, score (0-100 or null, explain method in summary), indicators object with RSI, MACD, MA20, MA50, MA200, ADX (numbers or null), closes (array of up to 200 chronological {date,price}), support and resistance (arrays of numbers), scenarios (object bullish,neutral,bearish strings), business, summary, risk (strings), sources (HTTPS URL array). Never invent missing values; use null or empty arrays. Distinguish facts from scenarios. No trade execution.')};
function compare(){table('compare',[['סימול','ציון','מועד'],...Array.from(analyses.values()).sort((a,b)=>(b.score??-1)-(a.score??-1)).map(a=>[a.symbol,a.score,a.asOf])])}
function render(a){e('result').hidden=false;e('name').textContent=a.symbol;e('price').textContent=(a.price===null?'מחיר לא זמין':'$'+a.price)+(finite(a.changePct)?' | '+a.changePct+'%':'');e('date').textContent='נתונים מיובאים: '+a.asOf+(Date.now()-Date.parse(a.asOf)>86400000?' | ישן מ־24 שעות':'');e('score').hidden=a.score===null;e('score').value=a.score??0;e('scoreText').textContent=a.score===null?'לא זמין':a.score+'/100 — ציון מיובא, לא הסתברות';table('ind',[['מדד','ערך'],...['RSI','MACD','MA20','MA50','MA200','ADX'].map(k=>[k,a.indicators[k]])]);e('levels').textContent='תמיכות: '+(a.support.join(', ')||'לא זמין')+' | התנגדויות: '+(a.resistance.join(', ')||'לא זמין');table('scenarios',[['תרחיש','תנאי ויעדים'],['שורי',a.scenarios.bullish],['ניטרלי',a.scenarios.neutral],['דובי',a.scenarios.bearish]]);e('business').textContent=a.business;e('summary').textContent=a.summary+' | סיכון: '+a.risk;e('sources').replaceChildren();a.sources.forEach(s=>{const l=document.createElement('a');l.href=s;l.textContent=s;l.target='_blank';l.rel='noopener noreferrer';e('sources').append(l,document.createElement('br'))});const svg=e('chart');svg.replaceChildren();if(a.closes.length>1){const p=a.closes.map(x=>x.price),lo=Math.min(...p),hi=Math.max(...p);const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('points',p.map((v,i)=>(10+i*580/(p.length-1))+','+(190-(v-lo)/(hi-lo||1)*180)).join(' '));line.setAttribute('stroke','#35bca1');line.setAttribute('fill','none');line.setAttribute('stroke-width','2');svg.append(line)}}
e('load').onclick=()=>{try{const a=JSON.parse(e('analysis').value),nullable=n=>n===null||finite(n),levels=v=>Array.isArray(v)&&v.length<=20&&v.every(n=>finite(n)&&n>0);if(!ranking.some(x=>x.symbol===a.symbol)||a.symbol!==e('symbol').value||!date(a.asOf)||!nullable(a.price)||(a.price!==null&&a.price<=0)||!nullable(a.changePct)||!nullable(a.score)||(a.score!==null&&(a.score<0||a.score>100))||!a.indicators||!['RSI','MACD','MA20','MA50','MA200','ADX'].every(k=>nullable(a.indicators[k]))||!levels(a.support)||!levels(a.resistance)||!Array.isArray(a.closes)||a.closes.length>200||!a.closes.every((v,i)=>typeof v.date==='string'&&Number.isFinite(Date.parse(v.date))&&finite(v.price)&&v.price>0&&(!i||Date.parse(v.date)>Date.parse(a.closes[i-1].date)))||!a.scenarios||!['bullish','neutral','bearish'].every(k=>str(a.scenarios[k]))||![a.business,a.summary,a.risk].every(str)||!Array.isArray(a.sources)||!a.sources.length||a.sources.length>20||!a.sources.every(source))throw Error();analyses.set(a.symbol,a);render(a);compare();msg('הניתוח נטען — לא אומת עצמאית')}catch{msg('JSON לא תקין או חסרים נתונים')}};e('symbol').onchange=()=>{const a=analyses.get(e('symbol').value);if(a)render(a);else e('result').hidden=true};
</script></html>
